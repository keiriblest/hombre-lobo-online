<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hombre Lobo Online</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="screen-lobby" class="screen active">
  <div class="card">
    <h1>🐺 Hombre Lobo Online</h1>
    <input id="input-name" type="text" placeholder="Tu nombre" maxlength="20" />

    <div class="lobby-actions">
      <button id="btn-create">Crear sala</button>
      <div class="join-row">
        <input id="input-code" type="text" placeholder="Codigo de sala" maxlength="5" />
        <button id="btn-join">Unirse</button>
      </div>
    </div>
    <p id="lobby-error" class="error"></p>
  </div>
</div>

<div id="screen-room" class="screen">
  <div class="card">
    <h2>Sala: <span id="room-code-label"></span></h2>
    <ul id="player-list" class="player-list"></ul>
    <button id="btn-start" class="hidden">Iniciar partida (min. 4 jugadores)</button>
    <p id="room-hint" class="hint">Comparte el codigo de sala con tus amigos.</p>
  </div>
</div>

<div id="screen-role" class="screen">
  <div class="card">
    <h2>Tu rol</h2>
    <div id="role-name" class="role-badge"></div>
    <p id="role-description"></p>
    <button id="btn-continue-role">Continuar</button>
  </div>
</div>

<div id="screen-game" class="screen">
  <div class="game-layout">
    <div class="phase-header">
      <span id="phase-label">Fase</span>
      <span id="phase-timer"></span>
      <span id="day-number"></span>
    </div>

    <div id="night-panel" class="panel hidden">
      <h3 id="night-action-title">Accion nocturna</h3>
      <div id="night-targets" class="target-list"></div>
      <p id="night-wait-msg" class="hint">Espera a que actuen los demas roles...</p>
    </div>

    <div id="voting-panel" class="panel hidden">
      <h3>Votacion: ¿quien es sospechoso?</h3>
      <div id="voting-targets" class="target-list"></div>
    </div>

    <div class="side-by-side">
      <div id="players-panel" class="panel">
        <h3>Jugadores</h3>
        <ul id="game-player-list" class="player-list"></ul>
      </div>

      <div id="chat-panel" class="panel">
        <h3>Chat</h3>
        <div id="chat-log" class="chat-log"></div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="Escribe un mensaje..." maxlength="200" />
          <button id="btn-send-chat">Enviar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="screen-end" class="screen">
  <div class="card">
    <h2 id="end-title"></h2>
    <ul id="end-roles" class="player-list"></ul>
    <button id="btn-back-lobby">Volver al lobby</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/main.js"></script>
</body>
</html>
